name: Inspect staged package

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect staged XZ payload
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64, lzma

          chunks = sorted(Path(".skill-upload").glob("chunk_*"))
          print("chunks:", [(p.name, p.stat().st_size) for p in chunks])
          encoded = "".join(p.read_text(encoding="ascii").strip() for p in chunks)
          print("base64 chars:", len(encoded), "mod4:", len(encoded) % 4)
          encoded += "=" * (-len(encoded) % 4)
          raw = base64.b64decode(encoded)
          print("decoded XZ bytes:", len(raw), "head:", raw[:16].hex())

          dec = lzma.LZMADecompressor(format=lzma.FORMAT_XZ)
          try:
              data = dec.decompress(raw)
              print("decompressed bytes:", len(data), "eof:", dec.eof, "unused:", len(dec.unused_data))
          except Exception as e:
              print("decompress error:", repr(e))
              raise
          Path("/tmp/payload").write_bytes(data)
          print("payload head:", data[:32])
          PY
          file /tmp/payload || true
          tar -tf /tmp/payload 2>&1 | head -80 || true
          unzip -l /tmp/payload 2>&1 | head -30 || true
