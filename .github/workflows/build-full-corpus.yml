name: Build full official corpus
on:
  workflow_dispatch:
    inputs:
      latest:
        description: Resolve current upstream commits instead of the reviewed pinned snapshot
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: luau-corpus-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Fetch pinned official text and original licenses
        env:
          GITHUB_TOKEN: ${{ github.token }}
          USE_LATEST: ${{ inputs.latest }}
        run: |
          if [ "$USE_LATEST" = "true" ]; then
            python tools/fetch_corpus.py --latest
          else
            python tools/fetch_corpus.py
          fi
      - name: Check both corpora, run tests, index and package
        run: python tools/release_pack.py --require-corpus --out "${{ runner.temp }}/LuauAISkill-Full.zip"
      - name: Upload completed archive
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: LuauAISkill-full-corpus
          path: |
            ${{ runner.temp }}/LuauAISkill-Full.zip
            ${{ runner.temp }}/LuauAISkill-Full.zip.sha256
          if-no-files-found: error
          retention-days: 30
      - name: Upload diagnostics, including failure status
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: LuauAISkill-build-diagnostics
          path: |
            upstream/DOWNLOAD-REPORT.json
            qa/
          if-no-files-found: warn
          retention-days: 14
