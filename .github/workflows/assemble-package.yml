name: Assemble package

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  assemble:
    if: ${{ hashFiles('.skill-upload/chunk_00') != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild ZIP
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64, io, lzma, shutil, tarfile, tempfile, zipfile

          chunks = sorted(Path(".skill-upload").glob("chunk_*"))
          if not chunks:
              raise SystemExit("no staging chunks")
          encoded = "".join(p.read_text(encoding="ascii").strip() for p in chunks)
          encoded += "=" * (-len(encoded) % 4)
          raw = base64.b64decode(encoded, validate=True)
          data = lzma.decompress(raw)

          target = Path("LuauAISkill-Core-2026-09-26.zip")
          if data[:4] == b"PK\x03\x04":
              target.write_bytes(data)
          else:
              payload = Path("/tmp/luauaiskill-payload")
              payload.write_bytes(data)
              if not tarfile.is_tarfile(payload):
                  raise SystemExit(f"decoded payload is neither ZIP nor tar; head={data[:16]!r}, size={len(data)}")
              root = Path(tempfile.mkdtemp(prefix="luauaiskill-"))
              with tarfile.open(payload, "r:*") as tf:
                  tf.extractall(root)
              with zipfile.ZipFile(target, "w", zipfile.ZIP_DEFLATED, compresslevel=9) as zf:
                  for p in sorted(root.rglob("*")):
                      if p.is_file():
                          zf.write(p, p.relative_to(root).as_posix())

          with zipfile.ZipFile(target, "r") as zf:
              bad = zf.testzip()
              if bad:
                  raise SystemExit(f"corrupt member: {bad}")
              names = zf.namelist()
              if not any(n.endswith("/SKILL.md") or n == "SKILL.md" for n in names):
                  raise SystemExit("SKILL.md missing from reconstructed archive")
              print(f"ZIP OK: {target.stat().st_size} bytes, {len(names)} entries")
          PY
      - name: Commit ZIP and clean staging
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add LuauAISkill-Core-2026-09-26.zip
          git rm -r .skill-upload
          git rm .github/workflows/assemble-package.yml
          git commit -m "Add LuauAISkill package"
          git push
